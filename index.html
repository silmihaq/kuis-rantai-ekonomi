<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuis Rantai Ekonomi Kelas 7 (Otomatis Berurutan)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f0f4f8;
        color: #333;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      header {
        text-align: center;
        margin-bottom: 25px;
        width: 100%;
        max-width: 1100px;
      }

      header h1 {
        color: #2c3e50;
        margin-bottom: 5px;
      }

      header p {
        color: #7f8c8d;
        font-size: 1.1rem;
      }

      /* Papan Skor 4 Kelompok */
      .scoreboard-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        width: 100%;
        margin-top: 20px;
      }

      @media (max-width: 600px) {
        .scoreboard-container {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .team-box {
        background-color: white;
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-bottom: 5px solid #ccc;
        transition: all 0.3s ease;
        position: relative;
      }

      #team-1 {
        border-bottom-color: #3498db;
      }
      #team-2 {
        border-bottom-color: #e67e22;
      }
      #team-3 {
        border-bottom-color: #9b59b6;
      }
      #team-4 {
        border-bottom-color: #16a085;
      }

      /* Gaya untuk Tim yang sedang aktif/mendapat giliran */
      .team-box.active {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        background-color: #fffde7;
        border-top: 4px solid #f1c40f;
      }

      .turn-indicator {
        display: none;
        font-size: 0.8rem;
        color: #f39c12;
        font-weight: bold;
        margin-top: 5px;
      }

      .team-box.active .turn-indicator {
        display: block;
      }

      .team-name {
        font-size: 1.1rem;
        font-weight: bold;
        color: #34495e;
        margin-bottom: 5px;
      }

      .team-score {
        font-size: 2rem;
        font-weight: bold;
        color: #2c3e50;
      }

      /* Grid Kotak Angka */
      .grid-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        max-width: 1100px;
        width: 100%;
        margin-top: 25px;
      }

      @media (max-width: 900px) {
        .grid-container {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 700px) {
        .grid-container {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .quiz-card {
        height: 120px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        font-weight: bold;
        color: white;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .quiz-card:hover:not(.disabled) {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      }

      .quiz-card.disabled {
        cursor: not-allowed;
        opacity: 0.5;
        text-shadow: none;
      }

      /* Pop-up Modal Soal Ukuran Besar */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.75);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
      }

      .modal-content {
        background-color: white;
        padding: 40px;
        border-radius: 25px;
        max-width: 850px;
        width: 100%;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes scaleUp {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      #modal-title {
        font-size: 1.6rem;
        color: #e67e22;
        font-weight: bold;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 10px;
      }

      #modal-question {
        font-size: 2.2rem;
        font-weight: bold;
        margin: 40px 0;
        line-height: 1.5;
        color: #2c3e50;
      }

      /* Tombol Jawaban Jumbo */
      .btn-container {
        display: flex;
        gap: 25px;
        justify-content: center;
        margin-top: 20px;
      }

      .btn-choice {
        padding: 20px 50px;
        font-size: 1.8rem;
        font-weight: bold;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        color: white;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        transition:
          transform 0.1s,
          background-color 0.2s;
        min-width: 200px;
      }

      .btn-choice:active {
        transform: scale(0.95);
      }
      .btn-true {
        background-color: #2ecc71;
      }
      .btn-true:hover {
        background-color: #27ae60;
      }
      .btn-false {
        background-color: #e74c3c;
      }
      .btn-false:hover {
        background-color: #c0392b;
      }

      /* Hasil Feedback di Dalam Modal */
      .feedback-text {
        font-size: 3.5rem;
        font-weight: bold;
        margin: 30px 0;
      }
      .feedback-correct {
        color: #2ecc71;
      }
      .feedback-wrong {
        color: #e74c3c;
      }

      .btn-next {
        background-color: #34495e;
        color: white;
        padding: 12px 35px;
        font-size: 1.2rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        font-weight: bold;
      }

      /* Efek Kembang Api */
      .particle {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        animation: explode 0.6s ease-out forwards;
      }

      @keyframes explode {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), var(--y)) scale(0);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kuis Rantai Ekonomi Kelas 7</h1>
      <p>Kotak kuning di atas menandakan tim yang gilirannya menjawab!</p>

      <div class="scoreboard-container">
        <div class="team-box active" id="team-1">
          <div class="team-name">Kelompok 1</div>
          <div class="team-score" id="score-team-1">0</div>
          <div class="turn-indicator">★ GILIRAN MENJAWAB ★</div>
        </div>
        <div class="team-box" id="team-2">
          <div class="team-name">Kelompok 2</div>
          <div class="team-score" id="score-team-2">0</div>
          <div class="turn-indicator">★ GILIRAN MENJAWAB ★</div>
        </div>
        <div class="team-box" id="team-3">
          <div class="team-name">Kelompok 3</div>
          <div class="team-score" id="score-team-3">0</div>
          <div class="turn-indicator">★ GILIRAN MENJAWAB ★</div>
        </div>
        <div class="team-box" id="team-4">
          <div class="team-name">Kelompok 4</div>
          <div class="team-score" id="score-team-4">0</div>
          <div class="turn-indicator">★ GILIRAN MENJAWAB ★</div>
        </div>
      </div>
    </header>

    <main class="grid-container" id="quiz-grid"></main>

    <div class="modal" id="quiz-modal">
      <div class="modal-content" id="modal-inside"></div>
    </div>

    <script>
      const quizData = [
        {
          q: "Permintaan adalah jumlah barang yang ingin dan mampu dibeli oleh konsumen.",
          a: "Benar",
        },
        {
          q: "Sesuai hukum permintaan, jika harga barang naik, maka jumlah permintaan akan meningkat.",
          a: "Salah",
        },
        {
          q: "Kurva permintaan digambarkan dengan garis dari kiri atas ke kanan bawah.",
          a: "Benar",
        },
        {
          q: "Penawaran adalah jumlah barang yang ditawarkan atau dijual oleh produsen.",
          a: "Benar",
        },
        {
          q: "Jika harga barang turun, penjual akan semakin semangat menawarkan lebih banyak barang.",
          a: "Salah",
        },
        {
          q: "Kurva penawaran digambarkan dengan garis dari kiri bawah ke kanan atas.",
          a: "Benar",
        },
        {
          q: "Harga keseimbangan adalah harga kesepakatan antara penjual dan pembeli.",
          a: "Benar",
        },
        {
          q: "Peran utama masyarakat sebagai produsen adalah menciptakan permintaan barang.",
          a: "Salah",
        },
        {
          q: "Ojek online yang mengantar makanan termasuk ke dalam peran distributor.",
          a: "Benar",
        },
        {
          q: "Permintaan absolut adalah permintaan yang sudah disertai dengan uang dan daya beli.",
          a: "Salah",
        },
        {
          q: "Permintaan pasar adalah gabungan dari permintaan seluruh orang di dalam pasar.",
          a: "Benar",
        },
        {
          q: "Jika pendapatan atau gaji orang tua naik, biasanya jumlah permintaan jajan akan turun.",
          a: "Salah",
        },
        {
          q: "Es kulkul yang viral membuat permintaan terhadap es tersebut menjadi meningkat karena faktor selera.",
          a: "Benar",
        },
        {
          q: "Jika harga daging ayam naik mahal, maka permintaan terhadap tempe (barang pengganti) akan turun.",
          a: "Salah",
        },
        {
          q: "Menggunakan mesin canggih untuk membuat cilok dapat meningkatkan jumlah penawaran barang.",
          a: "Benar",
        },
        {
          q: "Bencana alam seperti banjir dapat menyebabkan penawaran hasil pertanian di pasar meningkat.",
          a: "Salah",
        },
        {
          q: "Jika harga pasar berada di bawah harga keseimbangan, maka akan terjadi kelangkaan barang.",
          a: "Benar",
        },
        {
          q: "Menimbun barang pokok saat langka agar bisa dijual mahal termasuk contoh perilaku ekonomi yang adil.",
          a: "Salah",
        },
        {
          q: "Membayar gorengan di kantin sesuai jumlah yang kita makan adalah wujud perilaku jujur dan anti-korupsi.",
          a: "Benar",
        },
        {
          q: "Jika pedagang mengurangi timbangan saat menjual barang, maka suasana pasar akan tetap stabil dan aman.",
          a: "Salah",
        },
      ];

      const teamScores = { 1: 0, 2: 0, 3: 0, 4: 0 };
      let currentTeamTurn = 1; // Permainan dimulai dari Tim 1
      const colors = [
        "#FF5733",
        "#2bc48a",
        "#3357FF",
        "#dbca12",
        "#FF33F3",
        "#33FFF0",
        "#FFA500",
        "#8A2BE2",
        "#00CED1",
        "#FF1493",
      ];
      let currentQuestionIndex = null;

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "flip") {
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            600,
            audioCtx.currentTime + 0.15,
          );
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === "correct") {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(
            80,
            audioCtx.currentTime + 0.25,
          );
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      }

      function createConfetti(e) {
        for (let i = 0; i < 30; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          p.style.left = e.clientX + "px";
          p.style.top = e.clientY + "px";
          p.style.setProperty("--x", Math.random() * 260 - 130 + "px");
          p.style.setProperty("--y", Math.random() * 260 - 130 + "px");
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 600);
        }
      }

      // Generate Grid
      const grid = document.getElementById("quiz-grid");
      quizData.forEach((data, index) => {
        const card = document.createElement("div");
        card.className = "quiz-card";
        card.id = `card-${index}`;
        card.style.backgroundColor = colors[index % colors.length];
        card.innerText = index + 1;

        card.onclick = function () {
          if (!card.classList.contains("disabled")) {
            openQuestion(index);
          }
        };
        grid.appendChild(card);
      });

      // Tampilkan jendela soal besar
      function openQuestion(index) {
        currentQuestionIndex = index;
        playSound("flip");

        const modalInside = document.getElementById("modal-inside");
        modalInside.innerHTML = `
                <div id="modal-title">PERTANYAAN UNTUK KELOMPOK ${currentTeamTurn}</div>
                <div id="modal-question">${quizData[index].q}</div>
                <div class="btn-container">
                    <button class="btn-choice btn-true" onclick="checkAnswer(event, 'Benar')">BENAR</button>
                    <button class="btn-choice btn-false" onclick="checkAnswer(event, 'Salah')">SALAH</button>
                </div>
            `;

        document.getElementById("quiz-modal").style.display = "flex";
      }

      // Cek Jawaban otomatis
      function checkAnswer(event, playerAnswer) {
        const correctAnswer = quizData[currentQuestionIndex].a;
        const modalInside = document.getElementById("modal-inside");

        if (playerAnswer === correctAnswer) {
          playSound("correct");
          createConfetti(event);

          // Tambah skor ke tim aktif secara otomatis
          teamScores[currentTeamTurn] += 10;
          document.getElementById(`score-team-${currentTeamTurn}`).innerText =
            teamScores[currentTeamTurn];

          modalInside.innerHTML = `
                    <div class="feedback-text feedback-correct">🎉 JAWABAN BENAR!</div>
                    <p style="font-size:1.4rem; color:#2c3e50;">Kelompok ${currentTeamTurn} mendapat +10 Poin!</p>
                    <button class="btn-next" onclick="closeModal(true)">Lanjutkan</button>
                `;
        } else {
          playSound("wrong");
          modalInside.innerHTML = `
                    <div class="feedback-text feedback-wrong">❌ JAWABAN SALAH</div>
                    <p style="font-size:1.4rem; color:#2c3e50;">Kelompok ${currentTeamTurn} tidak mendapat poin.</p>
                    <button class="btn-next" onclick="closeModal(false)">Lanjutkan</button>
                `;
        }
      }

      function closeModal(isCorrect) {
        const card = document.getElementById(`card-${currentQuestionIndex}`);
        card.classList.add("disabled");
        card.style.backgroundColor = isCorrect ? "#2ecc71" : "#e74c3c";
        card.innerText = isCorrect ? "✅" : "❌";

        // Sembunyikan pop-up
        document.getElementById("quiz-modal").style.display = "none";

        // Pindahkan giliran ke tim berikutnya secara berurutan (1 -> 2 -> 3 -> 4 -> 1)
        document
          .getElementById(`team-${currentTeamTurn}`)
          .classList.remove("active");
        currentTeamTurn = currentTeamTurn === 4 ? 1 : currentTeamTurn + 1;
        document
          .getElementById(`team-${currentTeamTurn}`)
          .classList.add("active");
      }
    </script>
  </body>
</html>
